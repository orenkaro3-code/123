<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>כניסה למחשב · פלטה</title><link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--a:#3D5AFE;--ink:#16181D;--mu:#6B7080;--bg:#F4F5F9;--line:#E3E5EA}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.55 Heebo,system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.card{width:min(100%,420px);background:#fff;border-radius:28px;padding:28px 22px;box-shadow:0 20px 50px rgba(20,24,40,.1);text-align:center}.logo{width:64px;height:64px;border-radius:20px}h1{font:800 26px Rubik,sans-serif;margin:12px 0 4px}p{color:#3A3E48;margin:8px 0}.mu{color:var(--mu);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:999px;border:1px solid var(--line);background:#fff;font:800 17px Heebo,sans-serif;color:var(--ink);margin-top:12px;cursor:pointer}.btn.pri{background:var(--a);color:#fff;border:0}.btn.apple{background:#000;color:#fff;border:0;opacity:.45}.btn:disabled{opacity:.5}
.who{display:flex;gap:12px;align-items:center;justify-content:center;margin:16px 0;background:var(--bg);border-radius:18px;padding:12px}.who img{width:44px;height:44px;border-radius:50%}.warn{background:#FFF6DA;border-radius:16px;padding:10px 12px;font-size:14px;color:#5C4600;margin-top:14px}.ok{font-size:64px}</style></head><body>
<div class="card" id="c"><img class="logo" src="/logo.png" alt=""><h1>כניסה לפלטה במחשב</h1><p>מתחברים כאן בטלפון, ומאשרים. המחשב ייכנס לבד לחשבון שלכם.</p>
<div id="step1"><button class="btn" id="g"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>המשך עם Google</button>
<button class="btn apple" disabled>  המשך עם Apple · בקרוב</button></div>
<div id="step2" hidden><div class="who" id="who"></div><button class="btn pri" id="ok">אישור כניסה במחשב</button><button class="btn" id="no">ביטול</button><div class="warn">⚠️ אשרו רק אם אתם עכשיו מול המחשב שלכם ואתם סרקתם את הקוד בעצמכם. אם מישהו שלח לכם את הקישור, לחצו ביטול.</div></div>
<p class="mu" id="st"></p></div>
<script>
const s=(new URLSearchParams(location.search).get('s')||'').replace(/[^a-z0-9]/g,''),$=q=>document.querySelector(q),st=$('#st');let tok='',tc=null;
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(s.length<24){$('#c').innerHTML='<h1>הקוד לא תקין</h1><p>חזרו למחשב, פתחו את הכניסה לפלטה ובחרו "כניסה עם הטלפון" כדי לקבל קוד חדש.</p>'}
async function init(){try{const cfg=await (await fetch('/api/config')).json();if(!cfg.googleClientId)throw 0;await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
 tc=google.accounts.oauth2.initTokenClient({client_id:cfg.googleClientId,scope:'openid email profile',callback:async t=>{if(!t||!t.access_token){st.textContent='ההתחברות לא הושלמה';return}tok=t.access_token;try{const p=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}})).json();
  $('#who').innerHTML=(p.picture?`<img src="${esc(p.picture)}" alt="">`:'')+`<div style="text-align:right"><b>${esc(p.name)}</b><div class="mu">${esc(p.email)}</div></div>`;$('#step1').hidden=true;$('#step2').hidden=false;st.textContent=''}catch(e){st.textContent='לא הצלחנו לקרוא את החשבון'}}})}catch(e){st.textContent='ההתחברות עם Google לא זמינה כרגע'}}
$('#g').onclick=()=>{if(!tc){st.textContent='רגע, נטען…';return}tc.requestAccessToken({prompt:'select_account'})};
$('#no').onclick=()=>{$('#c').innerHTML='<h1>בוטל</h1><p>המחשב לא נכנס לחשבון. אפשר לסגור את הדף.</p>'};
$('#ok').onclick=async()=>{$('#ok').disabled=true;st.textContent='מאשר…';try{const r=await fetch('/api/qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({s,gtoken:tok})});const j=await r.json();if(!r.ok)throw new Error(j.error||'');$('#c').innerHTML=`<div class="ok">✅</div><h1>המחשב נכנס!</h1><p>שלום ${esc(j.name)}, אפשר לחזור למחשב ולהמשיך לעצב.</p>`}catch(e){st.textContent=e.message||'האישור לא הצליח. נסו שוב';$('#ok').disabled=false}};
if(s.length>=24)init();
</script></body></html>
