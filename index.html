<style>
/* Layout: home screen (dark search hero, category rail, masonry templates) + studio (brand band, icon rail + drawer on the right, canvas, page strip) */
:root{
--app:#F2F3F5; --panel:#FFFFFF; --panel2:#F4F5F7; --ink:#16181D; --muted:#5F6573; --line:#E3E5EA;

}
html,body{height:100%}
body{background:var(--app);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}

.homebtn{border-radius:10px;padding:4px 6px}.homebtn:hover{background:var(--top-soft)}

.dh{font-family:var(--f-brand);font-weight:700;font-size:18px;margin:0 0 12px}
.sh{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between}
.search{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);padding:0 14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.tcard{display:flex;flex-direction:column;gap:5px;text-align:start}

.flist{display:grid;gap:4px}

.drop{border:2px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--muted);margin-top:10px;line-height:1.5}

.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.el img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

.lockb{position:absolute;top:calc(-14px*var(--inv));right:calc(-14px*var(--inv));width:calc(26px*var(--inv));height:calc(26px*var(--inv));border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
